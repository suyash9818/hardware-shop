{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Hardware Shop{% endblock %}</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="{% static 'css/styles.css' %}" rel="stylesheet">
  </head>

  <body class="bg-gradient-soft">
    <a class="visually-hidden-focusable position-absolute top-0 start-0 m-2 btn btn-primary" href="#main-content">Skip to content</a>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-blur sticky-top">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="/">
          <span class="brand-mark"><i class="bi bi-nut"></i></span>
          <span>Hardware Shop</span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain" aria-controls="navMain" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navMain">
          <div class="navbar-nav ms-auto gap-lg-1">
            <a class="nav-link" href="/catalog/products/"><i class="bi bi-grid-3x3-gap me-1"></i>Products</a>
            <a class="nav-link" href="/cart/"><i class="bi bi-cart3 me-1"></i>Cart</a>
            <a class="nav-link" href="/orders/"><i class="bi bi-receipt me-1"></i>Orders</a>
            <a class="nav-link" href="/inventory/dashboard/"><i class="bi bi-box-seam me-1"></i>Inventory</a>
            <a class="nav-link" href="/manufacturing/dashboard/"><i class="bi bi-gear-wide-connected me-1"></i>Manufacturing</a>
            <a class="nav-link" href="/pricing/dashboard/"><i class="bi bi-cash-coin me-1"></i>Cost & Availability</a>
            <a class="nav-link" href="/rma/"><i class="bi bi-arrow-counterclockwise me-1"></i>RMA</a>
            <a class="nav-link" href="/api/"><i class="bi bi-braces me-1"></i>API</a>
            <a class="nav-link" href="/admin/"><i class="bi bi-shield-lock me-1"></i>Admin</a>
          </div>
        </div>
      </div>
    </nav>

    <main id="main-content" class="container app-main py-4 py-lg-5">
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} mb-3" role="alert">{{ message }}</div>
        {% endfor %}
      {% endif %}
      {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/app.js' %}"></script>
  </body>
</html>
